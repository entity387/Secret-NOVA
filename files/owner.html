<body>

    <button class="nav-btn"        onclick="showPanel('users')"     id="nav-users"><span class="nav-icon">⊕</span> Users</button>

    <button class="nav-btn"        onclick="showPanel('settings')"  id="nav-settings"><span class="nav-icon">⊙</span> Settings</button>
    <button class="nav-btn"        onclick="showPanel('logs')"      id="nav-logs"><span class="nav-icon">⊟</span> Logs</button>
    <button class="nav-btn"        onclick="showPanel('analytics')" id="nav-analytics"><span class="nav-icon">📊</span> Analytics</button>

    <button class="nav-btn"        onclick="showPanel('roles')"     id="nav-roles"><span class="nav-icon">◇</span> Roles</button>
    <button class="nav-btn"        onclick="showPanel('guide')"     id="nav-guide"><span class="nav-icon">📋</span> Guide</button>

</aside>

<div class="main-area">
  <div class="topbar">
    <div class="topbar-title" id="topbarTitle">OVERVIEW</div>
    <div class="topbar-badges">
      <span class="badge badge-maint" id="badgeMaint" style="display:none">⚠ MAINTENANCE</span>
      <span class="badge badge-debug" id="badgeDebug" style="display:none">⚡ DEBUG</span>
      <span class="badge badge-owner">👑 OWNER</span>
    </div>
  </div>
  <div class="banner banner-maint" id="bannerMaint"></div>
  <div class="banner banner-debug" id="bannerDebug">⚡ Debug mode active</div>
  <div class="content" id="mainContent"><div class="empty">Loading...</div></div>
</div>

<div class="debug-hud" id="debugHud">
  <div class="hud-title">▸ Debug HUD</div>
  <div class="hud-row"><span class="hud-key">REAL ROLE</span><span class="hud-val">Owner</span></div>
  <div class="hud-row"><span class="hud-key">SIM ROLE</span><span class="hud-val" id="hudSim">—</span></div>
  <div class="hud-row"><span class="hud-key">DEBUG</span><span class="hud-val" id="hudDebug">off</span></div>
  <div class="hud-row"><span class="hud-key">USER</span><span class="hud-val" id="hudEmail" style="max-width:130px;overflow:hidden;text-overflow:ellipsis">—</span></div>
  <hr class="divider" style="margin:10px 0">
  <div class="form-label">Simulate Role</div>
  <select class="form-select" onchange="simRole(this.value)" style="font-size:12px;padding:6px 10px">
    <option value="">None</option>
    <option value="Owner">Owner</option>
    <option value="Mod">Mod</option>

<div id="modalContainer"></div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDocs, getDoc, addDoc, updateDoc,
  deleteDoc, query, orderBy, limit, onSnapshot, setDoc, arrayUnion, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyClEfbrTpSwVPpThWZJukobJN9tCKMXTx4",
  authDomain: "nova-7a26f.firebaseapp.com",
  projectId: "nova-7a26f",
  storageBucket: "nova-7a26f.firebasestorage.app",
  messagingSenderId: "98300801242",
  appId: "1:98300801242:web:77c16453b6dac8fed3b5e3",
  measurementId: "G-67N1G1RFMS"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const uid   = sessionStorage.getItem('nova_uid');
const email = sessionStorage.getItem('nova_email');
const role  = sessionStorage.getItem('nova_role');
if (!uid || role !== 'Owner') { window.location.href = 'index.html'; }

document.getElementById('userEmail').textContent = email || '—';
document.getElementById('hudEmail').textContent  = email || '—';

// Settings listener
onSnapshot(doc(db,'settings','global'), snap => {
  if (!snap.exists()) return;
  const s = snap.data();
  document.getElementById('badgeMaint').style.display = s.maintenance ? '' : 'none';
  document.getElementById('badgeDebug').style.display = s.debug ? '' : 'none';
  const bm = document.getElementById('bannerMaint');
  if (s.maintenance) { bm.style.display='block'; bm.textContent='⚠ '+(s.maintenanceMessage||'Maintenance active.'); }
  else bm.style.display='none';
  document.getElementById('bannerDebug').style.display = s.debug ? 'block' : 'none';
  document.getElementById('debugHud').style.display    = s.debug ? 'block' : 'none';
  document.getElementById('hudDebug').textContent      = s.debug ? 'on' : 'off';
});

// ── HELPERS ───────────────────────────────────────────────
window.showPanel = function(name) {
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const nb = document.getElementById('nav-'+name); if(nb) nb.classList.add('active');
  document.getElementById('topbarTitle').textContent = name.toUpperCase();
  ({overview,tickets,users,channels,settings,logs,alerts,roles,mytickets,guide:guidePanel,applications:applicationsPanel,analytics})[name]?.();
};
window.doLogout  = async () => { await signOut(auth); sessionStorage.clear(); window.location.href='index.html'; };
window.simRole   = r => { document.getElementById('hudSim').textContent = r||'—'; };

function ts(n) { if(!n) return '—'; const d=typeof n==='object'&&n.seconds?new Date(n.seconds*1000):new Date(n); return d.toLocaleString(); }
function closeModal() { document.getElementById('modalContainer').innerHTML=''; }
function openModal(html, lg=false) {
  document.getElementById('modalContainer').innerHTML =
    `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
       <div class="modal${lg?' modal-lg':''}">${html}</div>
     </div>`;
}
window.closeModal = closeModal;

async function writeLog(action) {
  await addDoc(collection(db,'logs'), { user:email, role:'Owner', action, timestamp:Date.now() });
}

function rolePill(r) {
  const map  = { Owner:'pill-owner', Mod:'pill-mod', Staff:'pill-staff', User:'pill-user' };
  const icons= { Owner:'👑 ', Mod:'🛡 ', Staff:'⚡ ', User:'' };
  return `<span class="pill ${map[r]||'pill-user'}">${icons[r]||''}${r}</span>`;
}

// ── LOAD ASSIGNABLE USERS (for ticket assignment) ─────────
async function loadAssignableUsers() {
  const snap = await getDocs(collection(db,'users'));
  // Owner can assign to anyone in the team
  return snap.docs
    .map(d => ({ uid:d.id, ...d.data() }))
    .filter(u => ['Senior Mod','Mod','Staff'].includes(u.role))
    .sort((a,b) => {
      const order = {'Senior Mod':0,'Mod':1,'Staff':2};
      if (order[a.role] !== order[b.role]) return order[a.role] - order[b.role];
      return (a.username||a.email).localeCompare(b.username||b.email);
    });
}

function buildAssignSelect(assignableUsers, currentAssigned) {
  const roleLabel = u => u.role==='Senior Mod'?'✦ Senior Mod':u.role==='Mod'?'🛡 Mod':'⚡ Staff';
  const opts = assignableUsers.map(u =>
    `<option value="${u.email}" ${currentAssigned===u.email?'selected':''}>${u.username||u.email} [${roleLabel(u)}]</option>`
  ).join('');
  return `<select class="form-select" id="mAssign">
    <option value="">Unassigned</option>
    <option value="${email}" ${currentAssigned===email?'selected':''}>Myself [👑 Owner]</option>
    ${opts}
  </select>`;
}

// ══════════════════════════════════════════════════════════
// OVERVIEW
// ══════════════════════════════════════════════════════════
async function overview() {
  document.getElementById('mainContent').innerHTML='<div class="empty">Loading...</div>';
  const [uSnap,tSnap,lSnap,aSnap] = await Promise.all([
    getDocs(collection(db,'users')),
    getDocs(collection(db,'tickets')),
    getDocs(query(collection(db,'logs'),orderBy('timestamp','desc'),limit(8))),
    getDocs(query(collection(db,'channels','devalerts','messages'),orderBy('timestamp','desc'),limit(5))),
  ]);
  const users  = uSnap.docs.map(d=>d.data());
  const staff  = users.filter(u=>u.role==='Staff').length;
  const mods   = users.filter(u=>u.role==='Mod').length;
  const open   = tSnap.docs.filter(d=>d.data().status==='open').length;
  const logRows = lSnap.docs.map(d=>{const l=d.data();return`<div class="log-entry"><span class="log-time">${ts(l.timestamp)}</span><span class="log-user">${l.user||'—'}</span><span class="log-action">${l.action}</span></div>`;}).join('')||'<div class="empty">No logs</div>';
  const alertRows = aSnap.docs.map(d=>{const a=d.data();return`<div class="alert-entry"><div class="alert-meta"><span class="alert-sender">${a.sender||'—'}</span><span class="alert-time">${ts(a.timestamp)}</span></div><div class="alert-text">${a.text||''}</div></div>`;}).join('')||'<div class="empty">No alerts</div>';
  document.getElementById('mainContent').innerHTML=`
  <div class="panel">
    <div class="panel-title">System Overview</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value accent">${users.length}</div></div>
      <div class="stat-card"><div class="stat-label">Staff</div><div class="stat-value">${staff}</div></div>
      <div class="stat-card"><div class="stat-label">Mods</div><div class="stat-value">${mods}</div></div>
      <div class="stat-card"><div class="stat-label">Open Tickets</div><div class="stat-value">${open}</div></div>
    </div>
    <div class="grid-2">
      <div><div class="section-header"><div class="section-title">Recent Logs</div></div><div class="card" style="padding:0">${logRows}</div></div>
      <div><div class="section-header"><div class="section-title">Mod Alerts</div></div><div class="card" style="padding:0">${alertRows}</div></div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════
// TICKETS
// ══════════════════════════════════════════════════════════
async function tickets() {
  document.getElementById('mainContent').innerHTML='<div class="empty">Loading...</div>';
  const snap = await getDocs(query(collection(db,'tickets'),orderBy('timestamp','desc')));
  const rows = snap.docs.map(d => {
    const t=d.data(); const id=d.id;
    const sp = {open:'pill-open',in_progress:'pill-progress',closed:'pill-closed'}[t.status]||'pill-none';
    const ep = {none:'pill-none',staff_to_mod:'pill-s2m',mod_to_senior:'pill-s2m',senior_to_owner:'pill-m2o'}[t.escalationLevel]||'pill-none';
    const pp = t.priority==='high'?'<span style="font-family:var(--mono);font-size:9px;background:rgba(248,81,73,0.15);color:var(--danger);padding:1px 6px;border-radius:2px;margin-left:5px">HIGH</span>':t.priority==='medium'?'<span style="font-family:var(--mono);font-size:9px;background:rgba(210,153,34,0.15);color:var(--warn);padding:1px 6px;border-radius:2px;margin-left:5px">MED</span>':'';
    return `<tr>
      <td><span style="cursor:pointer;color:var(--text);font-weight:600" onclick="openTicket('${id}')">${t.subject||'—'}</span>${pp}</td>
      <td class="mono" style="font-size:11px">${t.createdBy||'—'}</td>
      <td><span class="pill ${sp}">${t.status||'—'}</span></td>
      <td class="mono" style="font-size:11px">${t.assignedTo||'—'}</td>
      <td><span class="pill ${ep}">${({'none':'None','staff_to_mod':'Staff→Mod','mod_to_senior':'Mod→Senior','senior_to_owner':'Senior→Owner'}[t.escalationLevel]||t.escalationLevel||'none')}</span></td>
      <td class="mono" style="font-size:11px">${ts(t.timestamp)}</td>
      <td>
        <div class="flex-gap-sm">
          <button class="btn btn-sm" onclick="openTicket('${id}')">Open</button>
          <button class="btn btn-sm btn-danger" onclick="deleteTicket('${id}')">Del</button>
        </div>
      </td>
    </tr>`;
  }).join('')||'<tr><td colspan="7"><div class="empty">No tickets</div></td></tr>';

  document.getElementById('mainContent').innerHTML=`
  <div class="panel">
    <div class="section-header">
      <div class="panel-title">Ticket Management</div>
      <button class="btn btn-primary" onclick="newTicket()">+ New Ticket</button>
    </div>
    <div class="table-wrap">
      <table><thead><tr>
        <th>Subject</th><th>Created By</th><th>Status</th><th>Assigned To</th><th>Escalation</th><th>Created</th><th>Actions</th>
      </tr></thead><tbody>${rows}</tbody></table>
    </div>
  </div>`;
}

window.newTicket = async function() {
  const assignable = await loadAssignableUsers();
  openModal(`
    <div class="modal-title">New Ticket</div>
    <div class="form-group"><label class="form-label">Subject</label><input class="form-input" id="mSubject"></div>
    <div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" id="mMsg"></textarea></div>
    <div class="form-group"><label class="form-label">Assign To</label>${buildAssignSelect(assignable,'')}</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewTicket()">Create</button>
    </div>`);
};

window.saveNewTicket = async function() {
  const subj = document.getElementById('mSubject').value.trim();
  if (!subj) return;
  await addDoc(collection(db,'tickets'), {
    subject:subj, message:document.getElementById('mMsg').value.trim(),
    createdBy:email, assignedTo:document.getElementById('mAssign').value||'',
    status:'open', timestamp:Date.now(),
    escalationLevel:'none', escalationReason:'', escalatedBy:''
  });
  await writeLog(`Created ticket: ${subj}`);
  closeModal(); tickets();
};

// Open ticket in large modal with chat
window.openTicket = async function(id) {
  const snap = await getDoc(doc(db,'tickets',id));
  if (!snap.exists()) return;
  const t = snap.data();
  const assignable = await loadAssignableUsers();
  const sp = {open:'pill-open',in_progress:'pill-progress',closed:'pill-closed'}[t.status]||'pill-none';
  const ep = {none:'pill-none',staff_to_mod:'pill-s2m',mod_to_senior:'pill-s2m',senior_to_owner:'pill-m2o'}[t.escalationLevel]||'pill-none';
  const isAppeal = t.category === 'ban_appeal' || t.category === 'mute_appeal';
  let appealUser = null;
  if (isAppeal && t.createdByUid) {
    const uSnap = await getDoc(doc(db,'users',t.createdByUid));
    if (uSnap.exists()) appealUser = { uid: t.createdByUid, ...uSnap.data() };
  }
  const now = Date.now();
  const isMuted = appealUser && appealUser.mutedUntil && (appealUser.mutedUntil.seconds ? appealUser.mutedUntil.seconds*1000 : new Date(appealUser.mutedUntil).getTime()) > now;
  const isBanned = appealUser && (appealUser.banned || (appealUser.tempBannedUntil && (appealUser.tempBannedUntil.seconds ? appealUser.tempBannedUntil.seconds*1000 : new Date(appealUser.tempBannedUntil).getTime()) > now));

  openModal(`
    <div class="modal-title">Ticket: ${t.subject||'—'}</div>
    <div class="grid-2" style="gap:16px;margin-bottom:16px">
      <div>
        <div class="form-group">
          <div class="form-label">Status</div>
          <select class="form-select" id="tStatus">
            <option value="open"        ${t.status==='open'?'selected':''}>Open</option>
            <option value="in_progress" ${t.status==='in_progress'?'selected':''}>In Progress</option>
            <option value="closed"      ${t.status==='closed'?'selected':''}>Closed</option>
          </select>
        </div>
        <div class="form-group">
          <div class="form-label">Assign To</div>
          ${buildAssignSelect(assignable, t.assignedTo||'')}
        </div>
        <div class="form-group">
          <div class="form-label">Escalation</div>
          <select class="form-select" id="tEsc">
            <option value="none"             ${t.escalationLevel==='none'?'selected':''}>None</option>
            <option value="staff_to_mod"     ${t.escalationLevel==='staff_to_mod'?'selected':''}>Staff → Mod</option>
            <option value="mod_to_senior"    ${t.escalationLevel==='mod_to_senior'?'selected':''}>Mod → Senior Mod</option>
            <option value="senior_to_owner"  ${t.escalationLevel==='senior_to_owner'?'selected':''}>Senior Mod → Owner</option>
          </select>
        </div>
        <div class="form-group">
          <div class="form-label">Escalation Reason</div>
          <input class="form-input" id="tEscReason" value="${t.escalationReason||''}">
        </div>
      </div>
      <div>
        <div class="form-label" style="margin-bottom:8px">Details</div>
        <div style="font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-bottom:4px">CREATED BY</div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">${t.createdBy||'—'}</div>
        <div style="font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-bottom:4px">MESSAGE</div>
        <div style="font-size:13px;color:var(--text-muted);line-height:1.6;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:10px">${t.message||'(no message)'}</div>
      </div>
    </div>

    <div class="ticket-chat-wrap">
      <div class="ticket-chat-header">💬 Ticket Chat</div>
      <div class="ticket-chat-messages" id="tchatMessages">
        <div style="color:var(--text-dim);font-family:var(--mono);font-size:11px;text-align:center;padding:20px">Loading...</div>
      </div>
      <div class="ticket-chat-input">
        <input id="tchatInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendTicketChat('${id}')">
        <button onclick="sendTicketChat('${id}')">Send</button>
      </div>
    </div>

    ${isAppeal ? `<div style="padding:12px 14px;background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.2);border-radius:8px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div style="font-size:12px;color:var(--text-muted)">
        ${t.category==='mute_appeal'?'🔇 Mute Appeal':'🚫 Ban Appeal'} —
        <strong>${escHtml(t.createdByUsername||t.createdBy||'?')}</strong>
        ${isMuted?' · <span style="color:var(--warn)">Currently Muted</span>':''}
        ${isBanned?' · <span style="color:var(--danger)">Currently Banned</span>':''}
        ${!isMuted&&!isBanned?' · <span style="color:var(--success)">No active punishment</span>':''}
      </div>
      <div style="display:flex;gap:8px">
        ${isMuted?`<button class="btn" style="background:rgba(63,185,80,.15);border-color:rgba(63,185,80,.4);color:var(--success)" onclick="ownerAppealAction('${id}','unmute','${t.createdByUid||''}','${escHtml(t.createdByUsername||'')}')">✅ Unmute</button>`:''}
        ${isBanned?`<button class="btn" style="background:rgba(63,185,80,.15);border-color:rgba(63,185,80,.4);color:var(--success)" onclick="ownerAppealAction('${id}','unban','${t.createdByUid||''}','${escHtml(t.createdByUsername||'')}')">✅ Unban</button>`:''}
        <button class="btn" style="background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.3);color:var(--danger)" onclick="ownerAppealAction('${id}','deny','${t.createdByUid||''}','${escHtml(t.createdByUsername||'')}')">❌ Deny Appeal</button>
      </div>
    </div>` : ''}
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="closeTicket('${id}')">Close &amp; Delete Ticket</button>
      <button class="btn btn-primary" onclick="saveTicket('${id}')">Save Changes</button>
    </div>`, true);

  // Load ticket chat
  loadTicketChat(id);
};

function loadTicketChat(ticketId) {
  const q = query(collection(db,'tickets',ticketId,'chat'), orderBy('timestamp','asc'));
  const unsub = onSnapshot(q, snap => {
    const el = document.getElementById('tchatMessages');
    if (!el) { unsub(); return; }
    if (!snap.docs.length) {
      el.innerHTML = `<div style="color:var(--text-dim);font-family:var(--mono);font-size:11px;text-align:center;padding:20px">No messages yet</div>`;
      return;
    }
    el.innerHTML = snap.docs.map(d => {
      const m = d.data();
      const r = m.senderRole||'User';
      const cls = r==='Owner'?'avatar-owner':r==='Mod'?'avatar-mod':r==='Staff'?'avatar-staff':'avatar-user';
      const col = r==='Owner'?'var(--gold)':r==='Mod'?'var(--info)':r==='Staff'?'var(--success)':'var(--text)';
      return `<div class="tchat-msg">
        <div class="tchat-avatar ${cls}">${(m.senderEmail||'?')[0].toUpperCase()}</div>
        <div class="tchat-body">
          <div class="tchat-meta">
            <span class="tchat-author" style="color:${col}">${m.senderEmail||'—'}</span>
            <span class="tchat-time">${ts(m.timestamp)}</span>
          </div>
          <div class="tchat-text">${escHtml(m.text||'')}</div>
        </div>
      </div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  });
}

window.sendTicketChat = async function(ticketId) {
  const input = document.getElementById('tchatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await addDoc(collection(db,'tickets',ticketId,'chat'), {
    text, senderUid:uid, senderEmail:email, senderRole:'Owner', timestamp:Date.now()
  });
  try { await updateDoc(doc(db,'tickets',ticketId), { lastStaffReply:Date.now() }); } catch(_) {}
};

window.saveTicket = async function(id) {
  const data = {
    status:           document.getElementById('tStatus').value,
    assignedTo:       document.getElementById('mAssign').value||'',
    escalationLevel:  document.getElementById('tEsc').value,
    escalationReason: document.getElementById('tEscReason').value.trim(),
  };
  await updateDoc(doc(db,'tickets',id), data);

  closeModal(); tickets();
};

window.ownerAppealAction = async function(ticketId, action, uid, username) {
  if (!uid) { alert('Cannot find user.'); return; }
  if (action === 'unmute') {
    if (!confirm(`Unmute ${username}?`)) return;
    await updateDoc(doc(db,'users',uid), { mutedUntil: null });
    await updateDoc(doc(db,'tickets',ticketId), { status:'closed', appealOutcome:'approved' });
    await addDoc(collection(db,'tickets',ticketId,'chat'), {
      text:`✅ Appeal approved — ${username} has been unmuted by ${email}.`,
      senderUid:'system',senderEmail:'NOVA System',senderUsername:'NOVA System',senderRole:'System',timestamp:Date.now(),system:true
    });
    await writeLog(`Appeal approved: unmuted ${username}`);
    closeModal(); tickets();
  } else if (action === 'unban') {
    if (!confirm(`Unban ${username}?`)) return;
    await updateDoc(doc(db,'users',uid), { banned:false, tempBannedUntil:null });
    await updateDoc(doc(db,'tickets',ticketId), { status:'closed', appealOutcome:'approved' });
    await addDoc(collection(db,'tickets',ticketId,'chat'), {
      text:`✅ Appeal approved — ${username} has been unbanned by ${email}.`,
      senderUid:'system',senderEmail:'NOVA System',senderUsername:'NOVA System',senderRole:'System',timestamp:Date.now(),system:true
    });
    await writeLog(`Appeal approved: unbanned ${username}`);
    closeModal(); tickets();
  } else if (action === 'deny') {
    if (!confirm(`Deny ${username}'s appeal?`)) return;
    await updateDoc(doc(db,'tickets',ticketId), { status:'closed', appealOutcome:'denied' });
    await addDoc(collection(db,'tickets',ticketId,'chat'), {
      text:`❌ Appeal denied — your punishment will remain. If you have further questions, please contact an Owner.`,
      senderUid:'system',senderEmail:'NOVA System',senderUsername:'NOVA System',senderRole:'System',timestamp:Date.now(),system:true
    });
    await writeLog(`Appeal denied for ${username}`);
    closeModal(); tickets();
  }
};

window.closeTicket = async function(id) {
  if (!confirm('Close and permanently delete this ticket and its chat?')) return;
  // Delete chat subcollection messages
  const chatSnap = await getDocs(collection(db,'tickets',id,'chat'));
  for (const d of chatSnap.docs) await deleteDoc(d.ref);
  await deleteDoc(doc(db,'tickets',id));
  await writeLog(`Closed & deleted ticket ${id}`);
  closeModal(); tickets();
};

window.deleteTicket = async function(id) {
  if (!confirm('Delete this ticket?')) return;
  const chatSnap = await getDocs(collection(db,'tickets',id,'chat'));
  for (const d of chatSnap.docs) await deleteDoc(d.ref);
  await deleteDoc(doc(db,'tickets',id));
  await writeLog(`Deleted ticket ${id}`);
  tickets();
};

      text:`⚡ Welcome to the team, @${username}!\n\nYour staff application has been accepted. You now have access to the Staff Dashboard where you can manage tickets, warn and mute users, and escalate issues to Mods.\n\nIf you have any questions reach out to a Mod or the Owner. Welcome aboard! — NOVA Team`,

      timestamp:Date.now(),system:true,
    });
    await addDoc(collection(db,'tickets'),{
      subject:'Staff Application Accepted 🎉',
      message:`Congratulations ${username}! Your staff application has been accepted. Welcome to the NOVA team! Head over to #staff to get started.`,

      escalationLevel:'none',escalationReason:'',escalatedBy:''

function getModReason() {
  const sel = document.getElementById('mRuleSelect');
  if (!sel || !sel.value) { alert('Please select a rule before continuing.'); return null; }
  if (sel.value === 'other') {
    const txt = (document.getElementById('mOtherText')?.value||'').trim();
    if (txt.length < 3) { alert('Please describe the reason (at least 3 characters).'); return null; }
    return 'Other: ' + txt;
  }
  const guide = PUNISHMENT_GUIDE[sel.value];
  return (guide ? guide.label : sel.value);
}

window.showRuleHint = function showRuleHint(val, role) {
  const wrap = document.getElementById('mRuleHint');
  if (!wrap) return;
  if (!val || val === 'other') { wrap.innerHTML = ''; return; }
  const guide = PUNISHMENT_GUIDE[val];
  if (!guide) { wrap.innerHTML = ''; return; }
  const rows = guide.rows.map(r => {
    const s = SEV_CFG[r.sev] || SEV_CFG.low;
    const action = role === 'staff' ? r.staff : r.mod;
    const isOwner = action.includes('Owner');
    const isMod   = action.includes('Mod');
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:10px;font-weight:700;color:${s.col};background:${s.bg};padding:2px 8px;border-radius:8px;font-family:var(--mono);flex-shrink:0;min-width:62px;text-align:center">${s.label}</span>

window.saveUser = async function(uid2, uname) {
  const newRole  = document.getElementById('mRole').value;
  const muteDur  = document.getElementById('mMuteDur').value;
  const tempDur  = document.getElementById('mTempBan').value;
  const mutingOrBanning = muteDur || tempDur;
  const issuedBy = email || uid || 'Owner';
  const reason   = (()=>{
    const sel=document.getElementById('mRuleSelect');if(!sel||!sel.value)return'';
    if(sel.value==='other'){const t=document.getElementById('mOtherText')?.value.trim();return t?'Other: '+t:'';}
    return sel.value;
  })();
  if (mutingOrBanning && !reason) { alert('Please select a rule broken before applying a mute or temp ban.'); return; }
  const staffNotes = document.getElementById('mStaffNotes')?.value.trim()??'';
  const updates  = { role: newRole, staffNotes };
  // If demoting from a staff role, record it
  if(newRole && !['Staff','Mod','Senior Mod'].includes(newRole)){
    const prevSnap=await getDoc(doc(db,'users',uid2));
    const prevRole=prevSnap.exists()?prevSnap.data().role:'';
    if(['Staff','Mod','Senior Mod'].includes(prevRole)) updates.previousRoles=arrayUnion(prevRole);
  }
  const history  = [];
  if (muteDur) {
    const muteUntil = Date.now()+parseInt(muteDur);
    updates.mutedUntil = new Date(muteUntil);
    history.push({ type:'Mute', reason, at:Date.now() });
    updates.pendingNotifications = arrayUnion({ type:'Mute', reason, until:muteUntil, issuedBy:issuedBy, at:Date.now() });
  }
  if (tempDur) {
    updates.tempBannedUntil = new Date(Date.now()+parseInt(tempDur));
    history.push({ type:'Temp Ban', reason, at:Date.now() });
  }
  if (history.length) updates.punishmentHistory = arrayUnion(...history);
  await updateDoc(doc(db,'users',uid2), updates);
  await writeLog(`Updated user ${uname}: role=${newRole}`);

  // Post welcome message when promoted to Staff or Mod
  if (newRole === 'Staff' || newRole === 'Mod') {
    const chanId  = newRole === 'Staff' ? 'staff' : 'mod';
    const icon    = newRole === 'Staff' ? '⚡' : '🛡';
    const roleMsg = newRole === 'Staff'
      ? 'You now have access to the Staff Dashboard where you can manage tickets, warn and mute users, and escalate issues to Mods.'
      : 'You now have access to the Mod Dashboard with full moderation tools, ticket management, and team alerts.';
    const welcomeText = icon + ' Welcome to the team, @' + uname + '!\n\n' + roleMsg + '\n\nIf you have any questions reach out to the Owner or a senior team member. Welcome aboard! — NOVA Team';
    await addDoc(collection(db,'channels',chanId,'messages'), {
      text: welcomeText,
      senderUid:'system', senderEmail:'NOVA System',
      senderUsername:'NOVA System', senderRole:'System',
      timestamp:Date.now(), system:true,
    });
  }

  closeModal(); users();
};

    sendAlert('Emergency Lockdown Activated','NOVA Emergency Lockdown was activated.\n\n• By: '+email+'\n• Time: '+new Date().toLocaleString()+'\n\nOnly Owner and Senior Mods can access NOVA.');
  } else {
    await setDoc(doc(db,'settings','global'),{emergency:false,lockdownTriggeredBy:'',lockdownAt:0},{merge:true});
    await writeLog('Lifted EMERGENCY LOCKDOWN');
  }
  settings();
};
window.saveSetting = async (key,val) => {
  if(key==='debug'){const s=await getDoc(doc(db,'settings','global'));if(!s.data()?.maintenance&&val){alert('Debug requires maintenance mode.');settings();return;}}
  await setDoc(doc(db,'settings','global'),{[key]:val},{merge:true});
  await writeLog(`Setting: ${key}=${val}`); settings();
};
window.saveMessages = async () => {
  await setDoc(doc(db,'settings','global'),{maintenanceMessage:document.getElementById('sMaintMsg').value.trim(),emergencyMessage:document.getElementById('sEmergMsg').value.trim()},{merge:true});
  await writeLog('Updated system messages');
};

// ══════════════════════════════════════════════════════════
// ANALYTICS
// ══════════════════════════════════════════════════════════
async function analytics() {
  document.getElementById('mainContent').innerHTML='<div class="empty">Loading analytics...</div>';

  const now = Date.now();
  const DAY  = 86400000;
  const WEEK = DAY * 7;

  const [uSnap, lSnap, tSnap, arcadeSnap] = await Promise.all([
    getDocs(collection(db,'users')),
    getDocs(query(collection(db,'logs'), orderBy('timestamp','desc'), limit(500))),
    getDocs(collection(db,'tickets')),
    getDocs(collection(db,'arcade_plays')).catch(()=>({docs:[]})),
  ]);

  const users   = uSnap.docs.map(d=>({id:d.id,...d.data()}));
  // Build lookup: uid → display name, and email → display name
  const uidMap  = {};
  users.forEach(u=>{ 
    uidMap[u.id]    = u.username || u.email || u.id;
    if(u.email) uidMap[u.email] = u.username || u.email;
  });
  const resolve = key => uidMap[key] || key;
  const logs    = lSnap.docs.map(d=>d.data());
  const tickets = tSnap.docs.map(d=>d.data());

  // ── Active users ──────────────────────────────────────
  const activeToday  = users.filter(u=>u.lastSeen && (now-u.lastSeen) < DAY).length;
  const activeWeek   = users.filter(u=>u.lastSeen && (now-u.lastSeen) < WEEK).length;
  const newThisWeek  = users.filter(u=>u.joinedAt && (now-u.joinedAt) < WEEK).length;

  // ── Role breakdown ────────────────────────────────────
  const roleCounts = {Owner:0,'Senior Mod':0,Mod:0,Staff:0,User:0};
  users.forEach(u=>{ if(roleCounts[u.role]!==undefined) roleCounts[u.role]++; else roleCounts.User++; });

  // ── Most active users (by log actions) ───────────────
  const userActivity = {};
  logs.forEach(l=>{ 
    if(l.user){ 
      const name = resolve(l.user);
      userActivity[name]=(userActivity[name]||0)+1;
    }
  });
  const topUsers = Object.entries(userActivity).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // ── Ticket stats ──────────────────────────────────────
  const tOpen     = tickets.filter(t=>t.status==='open').length;
  const tClosed   = tickets.filter(t=>t.status==='closed').length;
  const tThisWeek = tickets.filter(t=>t.createdAt && (now-t.createdAt)<WEEK).length;

  // ── Arcade plays (if tracked) ─────────────────────────
  const arcadePlays = arcadeSnap.docs.map(d=>d.data());
  const gameCounts  = {};
  arcadePlays.forEach(p=>{ gameCounts[p.game]=(gameCounts[p.game]||0)+1; });
  const topGames = Object.entries(gameCounts).sort((a,b)=>b[1]-a[1]);

  // ── Action breakdown from logs ────────────────────────
  const actionCounts = {};
  logs.forEach(l=>{ 
    const key = l.action ? l.action.split(' ').slice(0,3).join(' ') : 'unknown';
    actionCounts[key]=(actionCounts[key]||0)+1;
  });
  const topActions = Object.entries(actionCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // ── Last seen distribution ────────────────────────────
  const seen1h   = users.filter(u=>u.lastSeen&&(now-u.lastSeen)<3600000).length;
  const seen24h  = users.filter(u=>u.lastSeen&&(now-u.lastSeen)<DAY).length;
  const seen7d   = users.filter(u=>u.lastSeen&&(now-u.lastSeen)<WEEK).length;
  const seen30d  = users.filter(u=>u.lastSeen&&(now-u.lastSeen)<DAY*30).length;
  const inactive = users.filter(u=>!u.lastSeen||(now-u.lastSeen)>=DAY*30).length;

  function bar(val, max, color='var(--accent)') {
    const pct = max ? Math.round((val/max)*100) : 0;
    return `<div style="display:flex;align-items:center;gap:8px;margin:4px 0">
      <div style="flex:1;background:var(--border);border-radius:2px;height:8px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${color};border-radius:2px;transition:width .4s"></div>
      </div>
      <span style="font-size:11px;color:var(--muted);min-width:28px;text-align:right">${val}</span>
    </div>`;
  }

  const roleColors = {Owner:'#f59e0b','Senior Mod':'#14b8a6',Mod:'#3b82f6',Staff:'#22c55e',User:'var(--muted)'};

  document.getElementById('mainContent').innerHTML = `
  <div class="panel">
    <div class="panel-title">📊 Analytics</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px">
      <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value accent">${users.length}</div></div>
      <div class="stat-card"><div class="stat-label">Active Today</div><div class="stat-value">${activeToday}</div></div>
      <div class="stat-card"><div class="stat-label">Active This Week</div><div class="stat-value">${activeWeek}</div></div>
      <div class="stat-card"><div class="stat-label">New This Week</div><div class="stat-value">${newThisWeek}</div></div>
      <div class="stat-card"><div class="stat-label">Open Tickets</div><div class="stat-value">${tOpen}</div></div>
      <div class="stat-card"><div class="stat-label">Tickets This Week</div><div class="stat-value">${tThisWeek}</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">

      <div class="card">
        <div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:12px;letter-spacing:1px">LAST SEEN</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px">Last hour</div>${bar(seen1h, users.length, '#22c55e')}
        <div style="font-size:12px;color:var(--muted);margin-top:8px;margin-bottom:4px">Last 24h</div>${bar(seen24h, users.length, '#3b82f6')}
        <div style="font-size:12px;color:var(--muted);margin-top:8px;margin-bottom:4px">Last 7 days</div>${bar(seen7d, users.length, '#f59e0b')}
        <div style="font-size:12px;color:var(--muted);margin-top:8px;margin-bottom:4px">Last 30 days</div>${bar(seen30d, users.length, '#f97316')}
        <div style="font-size:12px;color:var(--muted);margin-top:8px;margin-bottom:4px">Inactive 30d+</div>${bar(inactive, users.length, '#ef4444')}
      </div>

      <div class="card">
        <div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:12px;letter-spacing:1px">ROLES</div>
        ${Object.entries(roleCounts).map(([role,count])=>`
          <div style="font-size:12px;color:var(--muted);margin-bottom:4px">${role}</div>
          ${bar(count, users.length, roleColors[role]||'var(--accent)')}
        `).join('')}
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">

      <div class="card">
        <div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:12px;letter-spacing:1px">MOST ACTIVE USERS</div>
        ${topUsers.length ? topUsers.map(([user,count])=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px">
            <span style="color:var(--text)">${user}</span>
            <span style="color:var(--accent);font-weight:600">${count} actions</span>
          </div>`).join('') : '<div class="empty">No data yet</div>'}
      </div>

      <div class="card">
        <div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:12px;letter-spacing:1px">COMMON ACTIONS</div>
        ${topActions.length ? topActions.map(([action,count])=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px">
            <span style="color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%">${action}…</span>
            <span style="color:var(--accent);font-weight:600">${count}</span>
          </div>`).join('') : '<div class="empty">No logs yet</div>'}
      </div>
    </div>

    ${topGames.length ? `
    <div class="card" style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:12px;letter-spacing:1px">🕹 ARCADE — MOST PLAYED</div>
      ${topGames.map(([game,count])=>`
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px">${game}</div>
        ${bar(count, topGames[0][1], '#a78bfa')}
      `).join('')}
    </div>` : `
    <div class="card" style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px;letter-spacing:1px">🕹 ARCADE</div>
      <div class="empty" style="font-size:12px">Arcade tracking will appear here once players start logging plays.</div>
    </div>`}

    <div style="font-size:11px;color:var(--muted);text-align:right">
      Last updated: ${new Date().toLocaleString()}
      <button onclick="analytics()" style="margin-left:12px;background:none;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:3px 10px;border-radius:4px;cursor:pointer">↻ Refresh</button>
    </div>
  </div>`;
}

// ── UTILS ─────────────────────────────────────────────────
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

overview();
// ── MY TICKETS ────────────────────────────────────────────
async function mytickets() {
  document.getElementById('mainContent').innerHTML = '<div class="empty">Loading...</div>';
  const snap = await getDocs(collection(db,'tickets'));
  const mine = snap.docs.filter(d => {
    const t = d.data();
    return t.assignedTo === email;
  });

  if (!mine.length) {
    document.getElementById('mainContent').innerHTML = `
      <div class="panel"><div class="panel-title">My Assigned Tickets</div>
        <div class="empty" style="padding:48px">No tickets assigned to you yet</div>
      </div>`;
    return;
  }

  const rows = mine.map(d => {
    const t = d.data(); const id = d.id;
    const sp = {open:'pill-open',in_progress:'pill-progress',closed:'pill-closed'}[t.status]||'pill-none';
    const pp = t.priority==='high'
      ? '<span style="font-family:var(--mono);font-size:9px;background:rgba(248,81,73,0.15);color:var(--danger);padding:1px 6px;border-radius:2px;margin-left:5px">HIGH</span>'
      : t.priority==='medium'
      ? '<span style="font-family:var(--mono);font-size:9px;background:rgba(210,153,34,0.15);color:var(--warn);padding:1px 6px;border-radius:2px;margin-left:5px">MED</span>' : '';
    return `<tr>
      <td><span style="cursor:pointer;color:var(--text);font-weight:600" onclick="openTicket('${id}')">${escHtml(t.subject||'—')}</span>${pp}</td>
      <td class="mono" style="font-size:11px">${t.createdBy||'—'}</td>
      <td><span class="pill ${sp}">${t.status||'open'}</span></td>
      <td class="mono" style="font-size:11px">${ts(t.timestamp)}</td>
      <td><button class="btn btn-sm" onclick="openTicket('${id}')">Open</button></td>
    </tr>`;
  }).join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="panel"><div class="panel-title">My Assigned Tickets (${mine.length})</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Subject</th><th>Created By</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
}
